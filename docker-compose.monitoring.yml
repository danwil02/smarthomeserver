  #     - UP_INFLUXDB_V2=true
  #   networks:
  #     - homelab
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  telegraf:
    image: telegraf_fronius
    #user: root
    user: telegraf:1001
    build:
      context: ./telegraf-exec-fronius
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - "${DATADIR}/telegraf.conf:/etc/telegraf/telegraf.conf:ro"
      - "/mnt:/mnt:ro"
      - /var/run/docker.sock:/var/run/docker.sock
    # - /:/hostfs:ro
    devices:
      - /dev/disk/by-id/wwn-0x5000000000000001-part2:/dev/sdb2
    #   - /dev/sda:/dev/sda
    depends_on:
      - influxdb
    network_mode: host
    environment:
      - OPENWEATHERMAP_API_KEY=$OPENWEATHERMAP_API_KEY
      - INFLUXDB_TOKEN=$INFLUXDB_TOKEN
      - MQTT_USER=$MQTT_USER
      - MQTT_PASSWORD=$MQTT_PASSWORD
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homelab:
    external: true
