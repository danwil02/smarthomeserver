services:
  loki:
    container_name: loki
    image: grafana/loki:2.8.0
    restart: unless-stopped
    ports:
      - 3100:3100
    volumes:
      - ${DATADIR}/loki-config.yaml:/etc/loki/loki-config.yaml
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    container_name: promtail
    image: grafana/promtail:2.8.0
    restart: unless-stopped
    volumes:
      - /var/snap/docker/common/var-lib-docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ${DATADIR}/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      # to read container labels and logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: "grafana/grafana:latest"
    restart: unless-stopped
    user: "$PUID:$PGID"
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - "${DATADIR}/grafana/data:/var/lib/grafana"
      - "./configs/grafana.ini:/etc/grafana/grafana.ini"
      # The OAuth token exchange is a server-to-server call from Grafana's own container
      # straight to Authelia over HTTPS — unlike the browser redirect steps, your
      # browser's trust of the private CA doesn't cover this. Grafana needs its own copy.
      - "./configs/traefik/certs/ca.crt:/etc/grafana/ca.crt:ro"
    ports:
      - 3000:3000
    # uncomment this if you wanta to allow anonymus acces to Grafana for embedding (e.g. in Home Assistant dashboards)
    environment:
      # Grafana computes its own OAuth redirect_uri from server.domain/root_url, which
      # both defaulted to localhost:3000 — mismatched what's registered in Authelia's
      # client config and caused "invalid_request: redirect_uri does not match".
      - GF_SERVER_DOMAIN=grafana.lab
      - GF_SERVER_ROOT_URL=https://grafana.lab/
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=false
      # SSO via Authelia (native OIDC, not the forward-auth gate — see CLAUDE.md).
      # Local login form stays enabled until the Admin role mapping below is verified
      # working, so it's not possible to get locked out mid-setup.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authelia
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA=/etc/grafana/ca.crt
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.svc.lab/api/oidc/authorization
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.svc.lab/api/oidc/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.svc.lab/api/oidc/userinfo
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'admins') && 'Admin' || 'Viewer'
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.lab`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  influxdb:
    image: "influxdb:latest"
    restart: unless-stopped
    volumes:
      - ${DATADIR}/influxdb/data:/var/lib/influxdb2:rw
    healthcheck:
      test: [ "CMD", "curl", "-sI", "http://localhost:8086/ping" ]
      interval: 30s
      timeout: 1s
      retries: 24
    ports:
      - 8086:8086
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.influxdb.rule=Host(`influx.svc.lab`)"
      - "traefik.http.routers.influxdb.entrypoints=websecure"
      - "traefik.http.routers.influxdb.tls=true"
      - "traefik.http.routers.influxdb.middlewares=authelia@file"
      - "traefik.http.services.influxdb.loadbalancer.server.port=8086"

  # unpoller:
