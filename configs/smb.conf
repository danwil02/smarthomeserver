[global]
    workgroup = WORKGROUP
    server string = homelab
    security = user
    map to guest = never
    min protocol = SMB2

    # macOS / Time Machine compatibility
    vfs objects = catia fruit streams_xattr
    fruit:aapl = yes
    fruit:nfs_aces = no
    fruit:copyfile = no
    fruit:model = MacSamba
    fruit:metadata = stream
    ea support = yes

    log level = 1
    log file = /dev/stdout

[TimeMachine]
    path = /opt/timemachine
    valid users = %U
    read only = no
    browseable = yes
    vfs objects = catia fruit streams_xattr
    fruit:time machine = yes
    fruit:time machine max size = 1T

[Media]
    path = /media
    valid users = %U
    read only = no
    browseable = yes
    create mask = 0664
    directory mask = 0775
    vfs objects = catia fruit streams_xattr recycle
    recycle:repository = .recycle/%U
    recycle:keeptree = yes
    recycle:versions = yes
    recycle:touch = yes
    recycle:maxsize = 0
    recycle:exclude = *.tmp *.temp *.part
    recycle:exclude_dir = /tmp /.recycle
