[global]
    workgroup = WORKGROUP
    server string = homelab
    security = user
    map to guest = never
    min protocol = SMB2

    # macOS / Time Machine compatibility
    vfs objects = catia fruit streams_xattr
    fruit:aapl = yes
    fruit:nfs_aces = no
    fruit:copyfile = no
    fruit:model = MacSamba
    fruit:metadata = stream
    ea support = yes

    log level = 1
    log file = /dev/stdout

[TimeMachine]
    path = /opt/timemachine
    valid users = %U
    read only = no
    browseable = yes
    vfs objects = catia fruit streams_xattr
    fruit:time machine = yes
    fruit:time machine max size = 2T

[Media]
    path = /media
    valid users = %U
    read only = yes
    browseable = yes
    vfs objects = catia fruit streams_xattr
