# Recyclarr — TRaSH Guides quality profile sync
# Docs: https://recyclarr.dev/wiki/
#
# Run manually:   docker exec recyclarr recyclarr sync
# Dry run:        docker exec recyclarr recyclarr sync --preview
#
# API keys are injected from .env.local via RADARR_API_KEY and SONARR_API_KEY
# env vars set on the recyclarr container.

radarr:
  main:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    quality_profiles:
      - name: HD-1080p
    include:
      - template: radarr-quality-definition-movie
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web

sonarr:
  main:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_profiles:
      - name: WEB-1080p
    include:
      - template: sonarr-quality-definition-series
      - template: sonarr-quality-profile-web-1080p
      - template: sonarr-custom-formats-web-1080p
