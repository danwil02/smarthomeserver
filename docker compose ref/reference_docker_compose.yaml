  solaredge:
    restart: unless-stopped
    environment:
      INVERTER_ADDRESS: 10.0.0.177
      EXPORTER_INTERVAL: 5
      INVERTER_PORT: 1502
    build:
      context: ./SolarEdge-Exporter
    network_mode: host
    ports:
      - "2112:2112"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.solaredge.rule=Host(`solaredge.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.solaredge.entrypoints=websecure"
      - "traefik.http.routers.solaredge.tls.certresolver=mydnschallenge"
      - "traefik.http.services.solaredge.loadbalancer.server.port=2112"

