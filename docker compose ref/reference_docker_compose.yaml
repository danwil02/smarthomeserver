version: '3.6'

x-common-environment:
  &common-environment
  PUID: 1001
  PGID: 39

services:
  traefik:
    restart: always
    image: traefik
    command:
      - "--api.insecure=true"
      - "--log.level=INFO"

      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # - "--certificatesresolvers.mydnschallenge.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.mydnschallenge.acme.dnschallenge=true"
      - "--certificatesresolvers.mydnschallenge.acme.dnschallenge.provider=cloudflare"

      - "--certificatesresolvers.mydnschallenge.acme.email=acme@<DOMAIN_NAME>.com"
      - "--certificatesresolvers.mydnschallenge.acme.storage=/letsencrypt/acme.json"

      - "--providers.file=true"
      - "--providers.file.filename=/shared_config/services.yml"

    network_mode: host
    environment:
      - "CF_API_EMAIL=cloudflare@<DOMAIN_NAME>.com"
      - "CF_API_KEY=<redacted>"
        #ports:
        #      - "80:80"
        #      - "443:443"
        #      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
      - "./traefik_config:/shared_config"

  netdata:
    restart: unless-stopped
    image: netdata/netdata:latest
    hostname: <SERVER_NAME>.<DOMAIN_NAME>.com # set to fqdn of host
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    #network_mode: host
    environment:
      - PGID=995
      - DOCKER_HOST=proxy:2375

    volumes:
      - ./netdata/lib:/var/lib/netdata
      - ./netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./netdata/config:/etc/netdata
      - ./smartmontools/log:/var/log/smartd
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`netdata.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.netdata.entrypoints=websecure"
      - "traefik.http.routers.netdata.tls.certresolver=mydnschallenge"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"

  plex:
    restart: unless-stopped
    image: linuxserver/plex
    volumes:
      - /srv/dev-disk-by-label-Data/Video:/data
      - /srv/dev-disk-by-label-Data/plex-config:/config
    # ports:
    #   - "32400/tcp"
    #   - "32400/udp"
    environment:
      <<: *common-environment
    network_mode: host
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.routers.plex.tls.certresolver=mydnschallenge"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"

  radarr:
    restart: unless-stopped
    image: linuxserver/radarr
    volumes:
      - /srv/dev-disk-by-label-Data/sonarr-download:/downloads
      - /srv/dev-disk-by-label-Data/radarr-config:/config
      - /srv/dev-disk-by-label-Data/Video:/movies
    ports:
      - "7878"
    environment:
      <<: *common-environment
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=mydnschallenge"

  sonarr:
    restart: unless-stopped
    image: linuxserver/sonarr
    volumes:
      - /srv/dev-disk-by-label-Data/sonarr-config:/config
      - /srv/dev-disk-by-label-Data/sonarr-download:/downloads
      - /srv/dev-disk-by-label-Data/Video:/video
      - /srv/dev-disk-by-label-Data/Video:/tv
    ports:
      - "8989"
    environment:
      <<: *common-environment
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=mydnschallenge"

  jackett:
    restart: unless-stopped
    #    image: linuxserver/jackett:150
    image: linuxserver/jackett
    volumes:
      - /srv/dev-disk-by-label-Data/jackett-config:/config
      - /srv/dev-disk-by-label-Data/sonarr-download:/downloads
    ports:
      - "9117"
    environment:
      <<: *common-environment
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jackett.rule=Host(`jackett.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.jackett.entrypoints=websecure"
      - "traefik.http.routers.jackett.tls.certresolver=mydnschallenge"

  heimdall:
    restart: always
    image: linuxserver/heimdall
    volumes:
      - ./heimdall-config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.heimdall.rule=Host(`<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.heimdall.entrypoints=websecure"
      - "traefik.http.routers.heimdall.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https@docker"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  deluge:
    restart: unless-stopped
    # Pin deluge to 1.3.15
    image: linuxserver/deluge:5b398f77-ls22
    volumes:
      - /srv/dev-disk-by-label-Data/sonarr-download:/downloads
      - /srv/dev-disk-by-label-Data/deluge-config:/config
      # ports:
      # - "8112"
      #   - "6881-6891:6881-6891"
      # - "50881:50881"
    network_mode: host
    environment:
      <<: *common-environment
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deluge.rule=Host(`deluge.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.deluge.entrypoints=websecure"
      - "traefik.http.routers.deluge.tls.certresolver=mydnschallenge"
      - "traefik.http.services.deluge.loadbalancer.server.port=8112"
        #  portainer:
        #    restart: unless-stopped
        #    image: portainer/portainer
        #    volumes:
        #      - /var/run/docker.sock:/var/run/docker.sock
        #      - ./portainer_data:/data
        #    ports:
      # - "8000"
      #      - "9000"
      #    labels:
      #      - "traefik.enable=true"
      #      - "traefik.http.routers.portainer.rule=Host(`portainer.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      #      - "traefik.http.routers.portainer.entrypoints=websecure"
      #      - "traefik.http.routers.portainer.tls.certresolver=mydnschallenge"
      # - "traefik.http.services.portainer.loadbalancer.server.port=8112"

  prometheus:
    restart: unless-stopped
    image: prom/prometheus
    ports:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=mydnschallenge"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=4y"
  grafana:
    restart: unless-stopped
    image: grafana/grafana-oss:latest
    ports:
      - "3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=mydnschallenge"
        #  jellyfin:
        #    restart: unless-stopped
      #    image: linuxserver/jellyfin
      #    ports:
      #      - "8096"
      #      - "8920"
      #    volumes:
      #      - ./jellyfin/data:/data
      #      - ./jellyfin/config:/config
      #    labels:
      #      - "traefik.enable=true"
      #      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      #      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      #      - "traefik.http.routers.jellyfin.tls.certresolver=mydnschallenge"

  smartmontools:
    restart: unless-stopped
    privileged: true
    build:
      context: ./smartmontools
    volumes:
      - ./smartmontools/log:/var/log/smartd
  proxy:
    restart: unless-stopped
    image: tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
  dockerhost:
    restart: unless-stopped
    image: qoomon/docker-host
    cap_add:
      - NET_ADMIN
      - NET_RAW

