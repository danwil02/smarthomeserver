  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./homeassistant/:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    privileged: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`homeassistant.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.tls.certresolver=mydnschallenge"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"

  adguard:
    restart: unless-stopped
    image: "adguard/adguardhome"
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    network_mode: host
    ports:
      # DNS
      - "53:53/tcp"
      - "53:53/udp" # DNS over TLS
      - "853:853/tcp"
      # DNS over quic
      - "784:784/udp"
      - "853:853/udp"
      - "8853:8853/udp"
      # DNS crypt
      - "5443:5443/tcp"
      - "5443:5443/udp"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`adguard.<SERVER_NAME>.<DOMAIN_NAME>.com`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.tls.certresolver=mydnschallenge"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"

  samba:
    restart: unless-stopped
    image: "dperson/samba"
    volumes:
      - /srv/dev-disk-by-label-Data/Video:/share/video
    command: '-s "Video;/share/video" -n'
    ports:
      - "139:139"
      - "445:445"
