services:
  heimdall:
    image: linuxserver/heimdall:2.5.7
    container_name: heimdall
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATADIR}/heimdall:/config
    ports:
      - 9080:80
      - 9443:443
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.heimdall.rule=Host(`heimdall.lab`)"
      - "traefik.http.routers.heimdall.entrypoints=web"
      - "traefik.http.services.heimdall.loadbalancer.server.port=80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  duplicati:
    image: lscr.io/linuxserver/duplicati:2.0.6
    container_name: duplicati
    restart: unless-stopped
    environment:
      # PUID/PGID=0 (root) intentionally, not ${PUID}/${PGID} — Duplicati needs to
      # read files owned by every other container's internal user (postgres uid 70,
      # mosquitto uid 1883, root-owned Home Assistant .storage, etc). Backup source
      # is read-only for Duplicati; it only ever writes to /config and the remote target.
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    #- CLI_ARGS= #optional
    volumes:
      - ${DATADIR}/duplicati/config:/config
      - ${DATADIR}:/source
      - ${DATADIR}/../smarthomeserver:/smarthomeserver:ro
    ports:
      - 8200:8200
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.duplicati.rule=Host(`duplicati.lab`)"
      - "traefik.http.routers.duplicati.entrypoints=web"
      - "traefik.http.services.duplicati.loadbalancer.server.port=8200"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

