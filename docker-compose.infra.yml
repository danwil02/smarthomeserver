services:
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - 9444:9443
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - homelab
    logging:
      driver: loki
      options:
        loki-url: "${LOKI_URL}"
        mode: non-blocking
        max-buffer-size: 4m

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true # deleting old unused images automatically
    networks:
      - homelab
    logging:
      driver: loki
      options:
        loki-url: "${LOKI_URL}"
        mode: non-blocking
        max-buffer-size: 4m

  samba:
    image: dperson/samba
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/external_hdd:/mount
    command: '-s "Media;/mount;yes;yes;no;all;none" -u "admin;admin"'
    logging:
      driver: loki
      options:
        loki-url: "${LOKI_URL}"
        mode: non-blocking
        max-buffer-size: 4m

volumes:
  data:

networks:
  homelab:
    external: true
